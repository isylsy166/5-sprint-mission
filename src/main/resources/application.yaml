spring:
  application:
    name: discodeit

  servlet:
    multipart:
      maxFileSize: 10MB   # 파일 하나의 최대 크기
      maxRequestSize: 30MB  # 한 번에 최대 업로드 가능 용량

  discodeit:
    repository:
      type: file   # jcf | file
      file-directory: .discodeit

  datasource:
    url: jdbc:postgresql://localhost:5432/discodeit
    username: discodeit_user
    password: discodeit1234
    driver-class-name: org.postgresql.Driver

  sql:
    init:
      mode: always   # 항상 schema.sql 실행
      schema-locations: classpath:schema.sql

  jpa:
    hibernate:
      ddl-auto: none   # schema.sql로 테이블 생성 → JPA가 테이블 자동생성하지 않음
    show-sql: true     # 실행되는 SQL 로그 출력
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

logging:
  level:
    org.hibernate.SQL: debug
    org.hibernate.type.descriptor.sql.BasicBinder: trace
